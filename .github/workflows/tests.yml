name: UI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 09:15 UTC daily — a nightly smoke test against production.
    - cron: "15 9 * * *"
  workflow_dispatch:
  repository_dispatch:
    # Fired by portfolio-website-infra's deploy-frontend.yml after every frontend deploy.
    types: [frontend-changed]

jobs:
  test:
    runs-on: ubuntu-latest
    # Ships every browser + OS dependency already installed for this exact
    # Playwright version, so there's no `apt-get install` of ~180 packages on
    # every run — that step alone was taking 10+ minutes on a plain runner.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    # The container's default `run:` shell is sh (dash), not bash — dash's
    # `set` doesn't support `-o pipefail` ("Illegal option"). Force bash for
    # every step so pipefail (and any other bash-ism) works as expected.
    defaults:
      run:
        shell: bash
    steps:
      - name: Report pending status to portfolio-website-ui
        if: github.event_name == 'repository_dispatch'
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_UI_STATUS_TOKEN }}" \
            https://api.github.com/repos/shafi-hassan0/portfolio-website-ui/statuses/${{ github.event.client_payload.sha }} \
            -d "{\"state\":\"pending\",\"context\":\"UI Tests\",\"description\":\"Playwright suite running...\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run UI tests
        # set -o pipefail: without it, this step's exit code is `tee`'s (always
        # 0), not npm test's — so real test failures got silently reported as
        # a passing job and a green commit status.
        run: |
          set -o pipefail
          npm test | tee test-output.log

      - name: Extract test summary
        if: always() && github.event_name == 'repository_dispatch'
        id: summary
        # `|| true` on each grep: with pipefail active (this job's shell is
        # `bash`, whose GitHub-provided default template is `-e -o pipefail`),
        # a legitimate zero-match case — e.g. no "X failed" line at all when
        # nothing failed — would otherwise make grep's exit 1 propagate and
        # kill the step via -e, before the ${VAR:-default} fallback below
        # ever runs.
        run: |
          FAILED=$(grep -oE '^ *[0-9]+ failed$' test-output.log | tail -1 | xargs || true)
          PASSED=$(grep -oE '^ *[0-9]+ passed' test-output.log | tail -1 | xargs || true)
          SKIPPED=$(grep -oE '^ *[0-9]+ skipped$' test-output.log | tail -1 | xargs || true)
          LINE="${PASSED:-0 passed}, ${FAILED:-0 failed}, ${SKIPPED:-0 skipped}"
          echo "line=$LINE" >> "$GITHUB_OUTPUT"

      - name: Report success to portfolio-website-ui
        if: success() && github.event_name == 'repository_dispatch'
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_UI_STATUS_TOKEN }}" \
            https://api.github.com/repos/shafi-hassan0/portfolio-website-ui/statuses/${{ github.event.client_payload.sha }} \
            -d "{\"state\":\"success\",\"context\":\"UI Tests\",\"description\":\"${{ steps.summary.outputs.line }}\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

      - name: Report failure to portfolio-website-ui
        if: failure() && github.event_name == 'repository_dispatch'
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_UI_STATUS_TOKEN }}" \
            https://api.github.com/repos/shafi-hassan0/portfolio-website-ui/statuses/${{ github.event.client_payload.sha }} \
            -d "{\"state\":\"failure\",\"context\":\"UI Tests\",\"description\":\"${{ steps.summary.outputs.line }}\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
